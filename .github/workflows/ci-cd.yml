name: CI/CD Travel Booking

on:
  push:
    branches:
      - travel-booking

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build and Deploy Application
        run: docker compose -p travel-projectccit-main-main up -d --build

      - name: Verify Docker Deployment
        run: docker ps

      - name: Test Website
        run: curl -fsS http://localhost:8080/login.php
