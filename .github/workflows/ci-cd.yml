name: CI-CD Docker Deployment

on:
  push:
    branches: ["travel-booking"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Docker Service
        run: |
          docker --version
          docker compose version

      - name: Deploy Container Stack
        run: |
          docker compose -p travel-projectccit-main-main down
          docker compose -p travel-projectccit-main-main up -d --build
          docker ps
